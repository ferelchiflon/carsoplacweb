version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: carsoplac-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - carsoplac-network-prod

  backend:
    build:
      context: ./carsoplac-back
      dockerfile: Dockerfile
    container_name: carsoplac-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - backend_logs_prod:/app/logs
    networks:
      - carsoplac-network-prod

  nginx:
    image: nginx:alpine
    container_name: carsoplac-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./carsoplac-admin/dist:/usr/share/nginx/html/admin
      - ./carsoplac-principal/dist:/usr/share/nginx/html/principal
    depends_on:
      - backend
    networks:
      - carsoplac-network-prod

volumes:
  postgres_data_prod:
  backend_logs_prod:

networks:
  carsoplac-network-prod:
    driver: bridge